

[mcp_servers.chrome-devtools]
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@latest",
    "--browser-url=http://127.0.0.1:9222",
]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.excalidraw]
# Use WSL-local fnm to run Node (avoids Windows node.exe + multishell symlink issues)
command = "/home/user/.local/share/fnm/fnm"
args = [
    "exec",
    "--using",
    "v25.6.0",
    "--",
    "node",
    "/mnt/d/UserProjects/AI/mcp_excalidraw/dist/index.js",
]
enabled = false

[mcp_servers.excalidraw.env]
EXPRESS_SERVER_URL = "http://localhost:3000"
ENABLE_CANVAS_SYNC = "true"

[mcp_servers.svelte]
command = "npx"
args = ["-y", "@sveltejs/mcp"]
